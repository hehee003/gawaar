cessarily tall while doing it. I just thought you should know... fascinating innit brown boi \n\nnow go be cute or whatever."},{"title":"When you wanna be spoiled verbally","message":"Awwee look who's here to be spoiled! \n\nokay fine. sit down.... Or just take me in your lap whatever makes me comfortable... do that😊\n\nsoooo you are genuinely such a fucking lovely person. you're talented, you're creative, you're funny, you're smart i love how your brain works. the way you get obsessed with an idea and actually make something out of it. the random things you notice. the way you can be so serious about something and then say the dumbest shit two seconds later. the way you have your own little world going on in your head and somehow let me peek into it. especially when you sing. because why do you sound THAT good?? i could literally sit there and listen to you sing the most random song ever and still be completely invested. your voice has this thing about it that i don't know how to explain without sounding insane like as you know... i love when you sing... probably only time when im consciously listening to a song .. and i could hear you singing for ages you're one of those people i can keep discovering and somehow there's always something new to adore.\nwhich is honestly very inconvenient for me because apparently i have no intention of getting tired of you anytime soon\n\nbasically you're very very special to me.\n\nnow go enjoy your unnecessarily inflated ego. you earned it mwaahhh "},{"title":"When today is being stupid","message":"today is being stupid? yeahhh... i don't like that either \n\ni wish i could just appear beside you on days like this. i'd probably just sit next to you, listen to you complain, make fun of whatever pissed you off and then bother you until you feel at least 2% better. so for noww imagine me there being annoying about it also you don't have to make the day productive. you don't have to be okay every second. if today is shit then today i ometimes... this one of the time of those sometimes \n\nbut it's mostly and usually when you're not trying. which is honestly worse.\nanyways  carry on being adorable igg"},{"title":"When you start inventing fake scenarios","message":"oh you're making up scenarios again\ngood ones or the unnecessarily horrible ones this time 😭\nif it's a good one...carry on i guesssss....  live your little imaginary life for a bit idm mwahh \n\nif it's one of the bad ones...\nthe ones that make you scared. the ones that make you question everything. the ones where your brain takes one little thing and somehow turns it into the worst possible ending ik  they can feel very real when you're in them. but you don't know that yet. so don't let something that hasn't happened steal something that still could.\nyou don't have to figure out the ending tonight. you don't have to prepare yourself for a loss that hasn't even happened and you definitely don't have to ruin a good moment just because your brain has already written a bad one.\nlet the future come when it comes. for now  you're here... and that's enough. Everything will turn out exactly how you want it to be... In one way or another we always end up getting things we want. Bs stop preparing your brain for the worst and start preparing for the best ...live as if its already done. if your brain gives you one thousand logical thought and predict an outcome that you dont want just simply oppose the thought and keep telling yourself how you want it to be over and over and everything will be fine ... mwwaahh"},{"title":"When sleep has personally betrayed you","message":"my goodboiiii :( look at you still awake.\ncome onnn baby... you're supposed to be sleeping by now. my sweet boy. my babyboo. my pretty boii.... you've done enough for today, okay? you can stop being a responsible little adult for a minute and just be my baby. i'd have you tucked right against me rn....  all warm and sleepy and i'd just play with your hair until you started getting all heavy and quiet. probably kiss your forehead every five minutes because apparently i wouldn't be able to stop.\n“good boii”\nyes... that's it.\n\njust lie there and let me take care of you for a bit. you don't need to say anything.\nyou don't need to do anything. just close those pretty eyes for me. that's my good boy.\n\nsee? already getting sleepy.\n\ni'd rub your back slowly, kiss your temple, play with your hair, pull the blanket up properly because somehow you'd still manage to have one foot sticking out. and if you opened your eyes just to look at me... i'd smile and whisper“whattt? go to sleep” then kiss you again and again. and probably one more because i know myself. my sleepy baby. my sweet boii..my batman...my kuchupuchu.. \n\nyou can sleep now. i've got you.\nsleep nice for me, okay?\n\nthat's my boii mwwaahhhhh"},{"title":"When you need somewhere to put your feelings","message":"you don't have to explain everything to me, baby.... ik sometimes you go quiet and keep things in your head for a while. you think about them, turn them around, try to make sense of them before letting anyone else see them. so if you're reading this on one of those days... you can leave it here. the thing you're overthinking. the thing you're pretending doesn't bother you. the thing you're excited about but haven't told anyone yet. the thing you don't even have a name for. you don't have to make it sound reasonable. you don't have to know what you feel before you're allowed to feel it.\njust put it somewhere. here, with me. Even if its a simple ''idk\"\nthat's okay too. It will be fine...im always rooting for youu... Mwwaahhh\n"},{"title":"When life is doing too much","message":"life doing its little “let's see how much you can take” experiment again?\nrude babyy....anyways.. you don't have to win today. sometimes getting through the nonsense with your personality still intact is achievement enough and if everything feels like too much right now... just remember...\n\nthis is a chapter. not the whole fucking book. also....i love you.\n\nunrelated ...but important... \nMwwahhhh"},{"title":"When you're missing the future us","message":"if you're missing our future rn... just remember you still have no idea how much annoying you is waiting for you.\nall the random days. all the stupid little traditions we'll accidentally create.\nall the “remember when...” stories we haven't even made yet.\nbasically there's a whole ridiculous amount of us still waiting to happen.\n\nso yeah. you better stick around or else ima find you in afterlife and be insufferably petty i have plans to bother you for a very long time mwwaahh"},{"title":"When you need me in human form","message":"Come closer babyy...i need you tooo\n.... i want you properly...let me just hold you for a second because fuck i've wanted this for so long. i'm wrapping my arms around you and pulling you into me like i have absolutely no intention of letting you go anytime soon. i'm probably squeezing you way too hard too but idc. you're warm.\nyou're actually here. I keep touching you like i need to make sure you're real. my hands on your face, through your hair, around your shoulders, wherever they land really and i'm smiling like an idiot because you're right there and i don't have to say “i wish you were here” anymore....  i'm kissing your forehead.... then your cheek... then your jaw.\nthen i'd look at you for a second and probably go\n\n“come here”\n\nas if you weren't already close enough. i'd kiss you again... slower this time and then hide my face against your neck because apparently i'm suddenly shy after being the one who started all this. my arms are still around you though. obviously. i'd probably stay like that for ages. just holding you....  kissing you whenever i feel like it, playing with your hair, rubbing your back, randomly squeezing you closer because somehow even this doesn't feel close enough and if you try to move away i'll just pull you back.\n\n“where are you going?”\n-nowhere.\nyou're staying here. let me love you properly for a while. no screen between us. no stupid distance. just you in my arms, me pressed against you and all the affection i've been saving up finally having somewhere to go.\n\n\ndamn writing this made me miss you frrr like im actually sad that im not there with you....now i want you so badly with me"},{"title":"When something reminds you of my nonsense","message":"something reminded you of my nonsense? good for you ig 😭\n\nidk what to tell you. you knew what you were getting yourself into. at this point i've probably said enough random shit that you'll keep finding little reminders of me everywhere. sounds like a you problem tbh.\n\nanywaysss carry on 😊"},{"title":"When your brain needs customer support","message":"hellooo jiii  thank you for contacting customer support. we understand that your brain is currently being a little bitch and we're very sorry for the inconvenience. please know that your complaint has been received and is being taken very seriously.\n\nwe recommend drinking some water, taking a deep breath and not believing every ridiculous thing your brain has decided to tell you today. if the issue persists.... please contact me directly.\n\ni may not have a direct solution but i can easily take you closer to me and then hold you in my arms then brush your hair slowly with my fingers while kissing on your forehead and then gently holding you till you are a little calm and then check how chota anas is doing by slowly tracing my fingers on every veins of it ...and seeing if its feeling homesick...if it is then gently putting it in his home where he belongs while holding you on my chest exactly where you belong \n\nthank you for your patience. we apricot you very much.\n\n - management "},{"title":"When you require unreasonable affection","message":"Awwee someone needs affection.... come here baby ive got a lot of that for youuu:(\n\ni love you. i love you so much. like stupid amounts. embarrassing amounts. actually concerning amounts. i love you when you're being sweet, when you're being annoying, when you're yapping about something i barely understand, when you're quiet, when you're excited about something, when you're half asleep, when you're just existing and doing absolutely nothing. i love your voice. i love hearing you talk. i love when you sing.i love the way you moan... i love all your little habits and all the random things that make you you.\ni'd kiss your forehead approximately 700 times if you were here rn. then i'd hug you for way too long. then probably kiss you again because apparently one wasn't enough and i'd keep telling you i love you until you're like “okayyy i get it” and i'd be like no you don't actually... come hereeee\n\nanywaysss...\n\nthis is me aggressively loving you through a screen because that's what we have rn. mwahhhhmwahhhhmwahhh\n\nyou are very very very loved my gawarrr"},{"title":"When you blame the distance","message":"if you're blaming the distance right now... yeah okay. i'll allow it and fair tbh cause i do the same...\n\nbecause sometimes i really do wonder what we'd be like if you were just... here. like actually here. no waiting for calls, no staring at a screen, no “seeya/cya” when neither of us is actually ready to stop talking, no having to miss someone who's literally your favourite person. just you being somewhere within annoying range. i think i'd like that. but for now... here we are. still finding ways to be in each other's days from stupidly far away.\nthe distance has taken a lot of little things from us. but it hasn't managed to take us. so let it be annoying for a lil while... \n\nI miss you:("},{"title":"When you are smiling like an idiot","message":"ohhhh what's got you smiling like that 👀\n\ndon't tell me it's me. actually no.... wait. definitely tell me it's me. i like knowing i can still do that to you from all the way over here :(\n\nnow keep smilinggg  pretty boy \n\nMwwaahhh"},{"title":"When you need a tiny dose of me","message":"hi.\n\nthis is your tiny dose of me. unfortunately there is no cure for it.\nside effects may include randomly hearing my voice in your head saying “gawar ...” after you say something completely unnecessary or  remembering one of our stupid little conversations and occasionally missing me for no reason also please remember that somewhere out there i'm probably doing something completely unnecessary and thinking about you.\nprobably saying “yk what” and then taking 15 minutes to get to the actual point.\nsee? dose delivered.\n\nyou may now continue being tall and the protector of my chota anas "},{"title":"when you want to time travel","message":"okay come let's time travel for a sec.\n\ngo all the way back to when you'd say “i like you” and i'd literally curl up and blush like an idiot because apparently even two words from you were enough to completely mess with me and then that one random night...\n\nwe were on call and you thought i was sleeping. i wasn't  ahem ahem \n\ni was literally lying there pretending to be asleep while secretly listening to you....  Cause i was upset about something and didnt wanna mention it to youuu \nand then out of nowhere you said\n\n“i love you”\nmy heart started POUNDING.\n\nlike actually pounding so fast and for what i was just lying there doing absolutely nothing and suddenly i'm wide awake, trying not to move, trying not to smile, trying not to let you figure out that i heard you.\n\ni really wanted to keep pretending that i didn't hear a thing \n\nbut yk me.\n\ni cannot keep things from you to save my life. so the next day outta nowhere i told you \"i love you too\" and ofcourse you were blushing and clueless and embarrassed a bit.... \n\nand idk. something just changed after that.\nlike one random night, one sentence and suddenly things didn't feel the same anymore. there was this weird little before and after. before you said it and then everything after. sometimes i wish i could go back and be that girl for five minutes.\n\njust lying there, pretending to sleep, heart going absolutely insane because some idiot on the other end of the call had no idea what he'd just done to me.\n\n\nFyi : this is me 3rd time telling you this since you can't stop forgetting about it "},{"title":"when we're being weird again","message":"oh.\n\nwe're being weird again. somehow we're both saying things we don't actually mean properly, hearing things the other person didn't mean, getting annoyed, getting quiet, overthinking, misunderstanding and then somehow making it ten times bigger than it needed to be. classic usss \nso before either of us decides to write the ending while we're both upset...\n\npause.\n\ni don't want you to read this and suddenly become magically reasonable. that would be suspicious. just remember that it's not me against you. it's me and you.... both being confused little idiots, trying to explain things from inside our own heads and somehow expecting the other person to already know what we mean. we might not understand each other right now.\n\nthat's okay. we can take a breath. we can be quiet. we can come back to the conversation when we're not trying to protect ourselves from something that hasn't even happened. whatever weird little phase we're in when you open this... i hope you remember there's still a we /us  underneath it. don't let one bad moment speak for everything. Everything is good... We are good... things are fine...the world is not burning down "},{"title":" when you want a boring day with me","message":" okay imagine this.... \n\nit's just a normal day. nothing special happened. we don't have anywhere to be. you're probably on your laptop doing some architecture thing, making some tiny change that nobody else would even notice and i'm somewhere nearby doing my own thing while occasionally looking over at you for no reason. at some point i'll probably interrupt you to show you something completely irrelevant. you'll pretend i'm annoying. i'll continue anyway. we'll eat something, argue about what to watch, probably spend an hour choosing but honestly we would probably end up watching what i want toooo cause you promised to watch them with mee so you better finish watching whatever fighting and looting stuff that you watch as movie....yeah and then barely paying attention to it. you'll probably sing something randomly and i'll obviously stop whatever i'm doing to listen because apparently your singing has become one of my favourite background noises. maybe we'll go quiet for a while. you doing your thing, me doing mine. no pressure to talk. just knowing you're there. then one of us will say something stupid and somehow we'll end up laughing about it for way longer than it deserves and that's it.\nNothing cinematic.... just your glasses somewhere they shouldn't be, my stuff taking up too much space, half finished drinks sitting around... your voice from the other side of the room and me bothering you for the 47th time that day.\n\na completely ordinary day.you don't need to be anywhere else. it's just one of those days that quietly passes while you're living it and maybe you'll look around at some point and realise...\noh.... \nthis is nice."},{"title":"open me because you can ","message":"because you can. that's it. that's the card. you saw it. you got curious. you opened it. good job baby....  excellent decision making. Keep doing things just cause you can.... obviously not the one that can hurt me in any waysss but yeah ykwimmm\n\nthere wasn't even anything important in here btw.\n\njust me... your very own badmoshhh\n\nexisting.\n\nand definitely that's enough reason to make you open a little box on your screen. anywaysss since you're already here...\n\nSay hi to chota anas 🥰"}]}</script>
<script>
const data = JSON.parse(document.getElementById('initialData').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function renderGift(){
  const g = document.getElementById('giftRoot');
  g.innerHTML = 
    '<div class="scene" id="openingScene">'
    + '<article class="card">'
    + '<div class="tiny">' + esc(data.greeting) + '</div>'
    + '<h1 class="opening">a little something for you</h1>'
    + '<div class="bodytext">' + esc(data.message) + '</div>'
    + '<div class="signature">' + esc(data.signature) + '</div>'
    + '<button class="press" id="pressBtn">' + esc(data.button) + '</button>'
    + '</article></div>'
    + '<div class="jar-scene hidden" id="jarScene">'
    + '<div class="jar-wrap">'
    + '<div class="lid"></div><div class="jar-mouth"></div><div class="ribbon-band"></div>'
    + '<div class="bow"><span class="loop left"></span><span class="loop right"></span><span class="knot"></span><span class="tail left"></span><span class="tail right"></span></div>'
    + '<div class="jar"><div class="notes" id="notes"></div><div class="jar-label">' + esc(data.label) + '</div></div>'
    + '</div><div class="hint">' + esc(data.hint) + '</div>'
    + '<div class="jar-note-count">24 little pieces of me</div></div>';

  populateNotes();
  document.getElementById('pressBtn').addEventListener('click', () => {
    const o = document.getElementById('openingScene');
    o.classList.add('fade-out');
    setTimeout(() => {
      o.classList.add('hidden');
      document.getElementById('jarScene').classList.remove('hidden');
    }, 350);
  });
}

function populateNotes(){
  const n = document.getElementById('notes');
  n.innerHTML = '';
  const rotations=['-5deg','4deg','3deg','-3deg','6deg','-6deg','-3deg','4deg','5deg','-4deg','-5deg','3deg','-4deg','6deg','4deg','-5deg','-6deg','4deg','3deg','-3deg','-5deg','5deg','2deg','-4deg'];
  const offsets=[['0px','0px'],['1px','-1px'],['-1px','1px'],['1px','1px'],['-1px','-1px'],['0px','1px'],['1px','0px'],['-1px','0px'],['0px','-1px'],['1px','-1px'],['-1px','1px'],['0px','0px'],['1px','0px'],['-1px','0px'],['0px','1px'],['1px','1px'],['-1px','-1px'],['0px','-1px'],['1px','0px'],['-1px','1px'],['0px','0px'],['1px','-1px'],['-1px','0px'],['0px','1px']];
  data.letters.forEach((l,i)=>{
    const b=document.createElement('button');
    b.className='note';
    b.style.setProperty('--r',rotations[i % rotations.length]);
    b.style.setProperty('--x',offsets[i % offsets.length][0]);
    b.style.setProperty('--y',offsets[i % offsets.length][1]);
    b.style.zIndex=String(10+i%4);
    b.setAttribute('aria-label','Open letter '+(i+1)+': '+l.title);
    b.textContent=l.title;
    b.title=l.title;
    b.addEventListener('click',()=>openLetter(i));
    n.appendChild(b);
  });
}

function openLetter(i){
  const l=data.letters[i];
  document.getElementById('modalNum').textContent='letter '+String(i+1).padStart(2,'0')+' of 24';
  document.getElementById('modalTitle').textContent=l.title;
  document.getElementById('modalMessage').textContent=l.message;
  document.getElementById('modal').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeLetter(){
  document.getElementById('modal').classList.remove('show');
  document.body.style.overflow='';
}
document.getElementById('closeModal').addEventListener('click',closeLetter);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeLetter()});
renderGift();
</script>
</body>
</html>
